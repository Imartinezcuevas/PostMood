services:
  reddit-worker:
    build: 
      context: .
      dockerfile: ./services/reddit-worker/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      SERVICE_NAME: reddit-worker
    networks:
      - postmood-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      reddit-worker:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - postmood-net
    environment:
      SERVICE_NAME: api-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  sentiment-analyzer:
    build: 
      context: .
      dockerfile: ./services/sentiment-analyzer/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      SERVICE_NAME: sentiment-analyzer
    networks:
      - postmood-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - postmood-net
    restart: unless-stopped

  analyzer-worker:
    build: 
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    command: ["python", "worker.py"]
    depends_on:
      redis:
        condition: service_started
      reddit-worker:
        condition: service_healthy
      sentiment-analyzer:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVICE_NAME: analyzer-worker
    networks:
      - postmood-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; redis.Redis(host='redis', port=6379).ping()"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postmood
      POSTGRES_PASSWORD: postmood
      POSTGRES_DB: postmood
    volumes:
      - ./common/:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - postmood-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postmood -d postmood"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: 
      context: ./services/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - postmood-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api-gateway
      - sentiment-analyzer
      - reddit-worker
    networks:
      - postmood-net
      
  dataset-generator:
    build:
      context: .
      dockerfile: ./services/dataset-generator/Dockerfile
    image: dataset-generator:latest
    env_file:
      - .env
    networks:
      - postmood-net
    volumes:
      - dataset_output:/app/output
    restart: "no"

  airflow-init:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    command: bash -c "airflow db upgrade && airflow users create --username admin --firstname Admin --lastname Admin --role Admin --password admin --email admin@example.com"
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://postmood:postmood@postgres:5432/postmood"
      AIRFLOW__CORE__FERNET_KEY: "some_random_key"
      AIRFLOW__WEBSERVER__SECRET_KEY: "supersecret"
      PROJECT_ROOT: ${PROJECT_ROOT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postmood-net
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    command: webserver
    env_file:
      - .env
    environment:
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://postmood:postmood@postgres:5432/postmood"
      AIRFLOW__CORE__FERNET_KEY: "some_random_key"
      AIRFLOW__WEBSERVER__SECRET_KEY: "supersecret"
      PROJECT_ROOT: ${PROJECT_ROOT}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services/dataset-generator:/opt/dataset-generator
      - ./services/dataset-generator/output:/opt/dataset-generator/output
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    networks:
      - postmood-net

  airflow-scheduler:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    command: scheduler
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://postmood:postmood@postgres:5432/postmood"
      AIRFLOW__CORE__FERNET_KEY: "some_random_key"
      AIRFLOW__WEBSERVER__SECRET_KEY: "supersecret"
      PROJECT_ROOT: ${PROJECT_ROOT}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services/dataset-generator:/opt/dataset-generator
      - ./services/dataset-generator/output:/opt/dataset-generator/output
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - postmood-net
      
volumes:
  pgdata:
  dataset_output:

networks:
  postmood-net:
    driver: bridge