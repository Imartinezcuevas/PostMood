services:
  reddit-worker:
    build: ./services/reddit-worker
    ports:
      - "8001:8001"
    env_file:
      - .env
    networks:
      - postmood-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      reddit-worker:
        condition: service_healthy
    networks:
      - postmood-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  sentiment-analyzer:
    build: ./services/sentiment-analyzer
    ports:
      - "8002:8002"
    env_file:
      - .env
    networks:
      - postmood-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - postmood-net
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postmood
      POSTGRES_PASSWORD: postmood
      POSTGRES_DB: postmood
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - postmood-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  postmood-net:
    driver: bridge