services:
  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - sentiment-net

  reddit-worker:
    build: ./services/reddit-worker
    container_name: reddit-worker
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      - api-gateway
    networks:
      - sentiment-net

networks:
  sentiment-net:
    driver: bridge